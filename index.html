const S=[{"id":1,"p":1,"en":"Hello.","vi":"Xin chào.","chunks":["Hello."],"parts":["Hello."],"range":[0.22,0.67],"partRanges":[[0.22,0.67]]},{"id":2,"p":1,"en":"Today I want to talk about something that affects almost everyone: money.","vi":"Hôm nay tôi muốn nói về một điều ảnh hưởng đến hầu như tất cả mọi người: tiền bạc.","chunks":["Today I want to talk about","something that affects almost everyone: money."],"parts":["Today I want to talk about something that affects almost everyone: money."],"range":[1.28,6.61],"partRanges":[[1.28,6.61]]},{"id":3,"p":1,"en":"We often believe that financial success is simply about earning more, but our relationship with money is much more complicated.","vi":"Chúng ta thường tin rằng thành công về tài chính đơn giản là kiếm được nhiều tiền hơn, nhưng mối quan hệ của chúng ta với tiền bạc phức tạp hơn rất nhiều.","chunks":["We often believe that financial success","is simply about earning more,","but our relationship with money is","much more complicated."],"parts":["We often believe that financial success is simply about earning more,","but our relationship with money is much more complicated."],"range":[7.31,16.1],"partRanges":[[7.31,12.1],[12.48,16.1]]},{"id":4,"p":1,"en":"The way we spend, save, and invest is influenced by our emotions, habits, experiences, and beliefs.","vi":"Cách chúng ta chi tiêu, tiết kiệm và đầu tư chịu ảnh hưởng từ cảm xúc, thói quen, trải nghiệm và niềm tin của mình.","chunks":["The way we spend,","save, and invest is influenced by","our emotions, habits, experiences,","and beliefs."],"parts":["The way we spend, save, and invest is influenced by our emotions, habits, experiences, and beliefs."],"range":[16.8,25.67],"partRanges":[[16.8,25.67]]},{"id":5,"p":1,"en":"Two people can earn the same amount of money and make completely different decisions because they have different ideas about what money means to them.","vi":"Hai người có thể kiếm được cùng một số tiền nhưng đưa ra những quyết định hoàn toàn khác nhau vì họ có những quan niệm khác nhau về ý nghĩa của tiền bạc đối với mình.","chunks":["Two people can earn the same","amount of money and make completely","different decisions because they have different","ideas about what money means to them."],"parts":["Two people can earn the same amount of money and make completely different decisions","because they have different ideas about what money means to them."],"range":[26.38,34.8],"partRanges":[[26.38,30.91],[31.11,34.8]]},{"id":6,"p":1,"en":"Some people see money as security, while others see it as freedom, status, or a way to enjoy life.","vi":"Một số người xem tiền bạc là sự bảo đảm, trong khi những người khác coi đó là tự do, địa vị hoặc một cách để tận hưởng cuộc sống.","chunks":["Some people see money as security,","while others see it as freedom,","status, or a way to enjoy life."],"parts":["Some people see money as security,","while others see it as freedom, status, or a way to enjoy life."],"range":[35.27,42.76],"partRanges":[[35.27,37.49],[37.79,42.76]]},{"id":7,"p":2,"en":"Our behaviour with money is often shaped by our past.","vi":"Cách chúng ta ứng xử với tiền bạc thường được định hình bởi quá khứ.","chunks":["Our behaviour with money is often","shaped by our past."],"parts":["Our behaviour with money is often shaped by our past."],"range":[43.41,46.84],"partRanges":[[43.41,46.84]]},{"id":8,"p":2,"en":"Someone who grew up with financial difficulties may become very careful with spending, while someone who experienced financial comfort may be more willing to take risks.","vi":"Người lớn lên trong hoàn cảnh khó khăn về tài chính có thể trở nên rất thận trọng khi chi tiêu, trong khi người từng sống trong điều kiện tài chính thoải mái có thể sẵn sàng chấp nhận rủi ro hơn.","chunks":["Someone who grew up with financial","difficulties may become very careful with","spending, while someone who experienced financial","comfort may be more willing to","take risks."],"parts":["Someone who grew up with financial difficulties may become very careful with spending,","while someone who experienced financial comfort may be more willing to take risks."],"range":[47.3,57.2],"partRanges":[[47.3,52.29],[52.66,57.2]]},{"id":9,"p":2,"en":"Fear, impatience, comparison, and the desire to impress others can also influence our choices.","vi":"Nỗi sợ, sự thiếu kiên nhẫn, việc so sánh bản thân và mong muốn gây ấn tượng với người khác cũng có thể ảnh hưởng đến lựa chọn của chúng ta.","chunks":["Fear, impatience, comparison, and the desire","to impress others can also influence","our choices."],"parts":["Fear, impatience, comparison, and the desire to impress others can also influence our choices."],"range":[58.03,65.12],"partRanges":[[58.03,65.12]]},{"id":10,"p":2,"en":"We may buy things we do not need simply because we want to feel successful.","vi":"Chúng ta có thể mua những thứ mình không cần chỉ vì muốn cảm thấy mình thành công.","chunks":["We may buy things we do","not need simply because we want","to feel successful."],"parts":["We may buy things we do not need simply because we want to feel successful."],"range":[65.65,70.31],"partRanges":[[65.65,70.31]]},{"id":11,"p":2,"en":"Understanding these emotions is important because earning more money does not automatically mean managing it well.","vi":"Hiểu những cảm xúc này rất quan trọng vì kiếm được nhiều tiền hơn không tự động đồng nghĩa với việc quản lý tiền tốt.","chunks":["Understanding these emotions is important because","earning more money does not automatically","mean managing it well."],"parts":["Understanding these emotions is important because earning more money does not automatically mean managing it well."],"range":[71.02,78.15],"partRanges":[[71.02,78.15]]},{"id":12,"p":2,"en":"Financial progress often comes from making thoughtful decisions consistently, controlling impulsive spending, and thinking beyond the present moment.","vi":"Tiến bộ về tài chính thường đến từ việc liên tục đưa ra những quyết định có cân nhắc, kiểm soát việc chi tiêu bốc đồng và suy nghĩ xa hơn thời điểm hiện tại.","chunks":["Financial progress often comes from making","thoughtful decisions consistently, controlling impulsive spending,","and thinking beyond the present moment."],"parts":["Financial progress often comes from making thoughtful decisions consistently,","controlling impulsive spending, and thinking beyond the present moment."],"range":[78.7,87.92],"partRanges":[[78.7,83.45],[83.74,87.92]]},{"id":13,"p":3,"en":"In the end, money is a tool, not a measure of your value as a person.","vi":"Sau cùng, tiền là một công cụ chứ không phải thước đo giá trị con người bạn.","chunks":["In the end, money is a","tool, not a measure of your","value as a person."],"parts":["In the end, money is a tool, not a measure of your value as a person."],"range":[88.85,93.83],"partRanges":[[88.85,93.83]]},{"id":14,"p":3,"en":"You do not need to become rich to have a meaningful life, but learning how to manage money can give you greater freedom and stability.","vi":"Bạn không cần trở nên giàu có để có một cuộc sống ý nghĩa, nhưng học cách quản lý tiền bạc có thể mang lại cho bạn nhiều tự do và sự ổn định hơn.","chunks":["You do not need to become","rich to have a meaningful life,","but learning how to manage money","can give you greater freedom and stability."],"parts":["You do not need to become rich to have a meaningful life,","but learning how to manage money can give you greater freedom and stability."],"range":[94.32,101.69],"partRanges":[[94.32,97.34],[97.54,101.69]]},{"id":15,"p":3,"en":"Save when you can, spend with purpose, avoid unnecessary debt, and think carefully before making major financial decisions.","vi":"Hãy tiết kiệm khi có thể, chi tiêu có mục đích, tránh các khoản nợ không cần thiết và suy nghĩ thận trọng trước khi đưa ra những quyết định tài chính lớn.","chunks":["Save when you can,","spend with purpose, avoid unnecessary debt,","and think carefully before making major","financial decisions."],"parts":["Save when you can, spend with purpose, avoid unnecessary debt,","and think carefully before making major financial decisions."],"range":[102.35,110.78],"partRanges":[[102.35,106.95],[107.24,110.78]]},{"id":16,"p":3,"en":"The real goal is not simply to have more money.","vi":"Mục tiêu thực sự không chỉ đơn giản là có nhiều tiền hơn.","chunks":["The real goal is not simply","to have more money."],"parts":["The real goal is not simply to have more money."],"range":[111.52,114.52],"partRanges":[[111.52,114.52]]},{"id":17,"p":3,"en":"It is to understand your relationship with money and use it to build the kind of life you genuinely want.","vi":"Mà là hiểu mối quan hệ của bạn với tiền bạc và sử dụng nó để xây dựng cuộc sống mà bạn thực sự mong muốn.","chunks":["It is to understand your relationship","with money and use it to","build the kind of life you","genuinely want."],"parts":["It is to understand your relationship with money","and use it to build the kind of life you genuinely want."],"range":[114.6,120.68],"partRanges":[[114.6,117.29],[117.41,120.68]]}];const V=[{"en":"financial success","ipa":"/faɪˈnænʃəl səkˈses/","vi":"thành công về tài chính","example":"Financial success requires clear goals and regular planning."},{"en":"relationship with money","ipa":"/rɪˈleɪʃənʃɪp wɪð ˈmʌni/","vi":"mối quan hệ với tiền bạc","example":"A healthy relationship with money can reduce stress."},{"en":"influenced by","ipa":"/ˈɪnfluənst baɪ/","vi":"chịu ảnh hưởng bởi","example":"Students are influenced by the learning environment."},{"en":"make completely different decisions","ipa":"/meɪk kəmˈpliːtli ˈdɪfrənt dɪˈsɪʒənz/","vi":"đưa ra những quyết định hoàn toàn khác nhau","example":"Two teams can make completely different decisions."},{"en":"see money as security","ipa":"/siː ˈmʌni æz sɪˈkjʊərəti/","vi":"xem tiền là sự bảo đảm","example":"Some families see education as security for the future."},{"en":"shaped by our past","ipa":"/ʃeɪpt baɪ ˈaʊə pɑːst/","vi":"được định hình bởi quá khứ","example":"Our opinions are often shaped by our past."},{"en":"financial difficulties","ipa":"/faɪˈnænʃəl ˈdɪfɪkəltiz/","vi":"khó khăn về tài chính","example":"The school helps students facing financial difficulties."},{"en":"be willing to take risks","ipa":"/bi ˈwɪlɪŋ tə teɪk rɪsks/","vi":"sẵn sàng chấp nhận rủi ro","example":"Researchers must be willing to take risks when testing new ideas."},{"en":"the desire to impress others","ipa":"/ðə dɪˈzaɪə tə ɪmˈpres ˈʌðəz/","vi":"mong muốn gây ấn tượng với người khác","example":"The desire to impress others may affect students’ choices."},{"en":"managing it well","ipa":"/ˈmænɪdʒɪŋ ɪt wel/","vi":"quản lý nó tốt","example":"Having more time does not guarantee managing it well."},{"en":"thoughtful decisions","ipa":"/ˈθɔːtfəl dɪˈsɪʒənz/","vi":"những quyết định có cân nhắc","example":"Good leaders make thoughtful decisions."},{"en":"impulsive spending","ipa":"/ɪmˈpʌlsɪv ˈspendɪŋ/","vi":"việc chi tiêu bốc đồng","example":"A clear budget can prevent impulsive spending."},{"en":"thinking beyond the present moment","ipa":"/ˈθɪŋkɪŋ bɪˈjɒnd ðə ˈprezənt ˈməʊmənt/","vi":"suy nghĩ vượt ra ngoài hiện tại","example":"Long-term planning involves thinking beyond the present moment."},{"en":"a measure of your value","ipa":"/ə ˈmeʒə əv jɔː ˈvæljuː/","vi":"thước đo giá trị của bạn","example":"A test score is not a measure of your value."},{"en":"a meaningful life","ipa":"/ə ˈmiːnɪŋfəl laɪf/","vi":"một cuộc sống có ý nghĩa","example":"Helping others can contribute to a meaningful life."},{"en":"freedom and stability","ipa":"/ˈfriːdəm ənd stəˈbɪləti/","vi":"tự do và sự ổn định","example":"Many workers seek freedom and stability."},{"en":"spend with purpose","ipa":"/spend wɪð ˈpɜːpəs/","vi":"chi tiêu có mục đích","example":"Families should spend with purpose during difficult times."},{"en":"unnecessary debt","ipa":"/ʌnˈnesəsəri det/","vi":"nợ không cần thiết","example":"Careful budgeting helps people avoid unnecessary debt."},{"en":"major financial decisions","ipa":"/ˈmeɪdʒə faɪˈnænʃəl dɪˈsɪʒənz/","vi":"quyết định tài chính quan trọng","example":"Families should discuss major financial decisions together."},{"en":"genuinely want","ipa":"/ˈdʒenjuɪnli wɒnt/","vi":"thực sự mong muốn","example":"Students learn better when they study subjects they genuinely want to explore."}];let tab='read',mode='read',idx=0,partIdx=0,vi=false,terms=true,shown=false,selected=[],bank=[],studied={},vocabIdx=-1,typed='',feed='';

let range=null, token=0, frame=0, highlighted=-1, followText=true;
function clock(t){return Number.isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'--:--'}
function setHighlight(id){if(highlighted===id)return;const old=document.querySelector('.sentence.is-playing');if(old)old.classList.remove('is-playing');highlighted=id;if(id>=0){let n=document.querySelector('.sentence[data-s="'+(id+1)+'"]');if(n){n.classList.add('is-playing');if(followText&&tab!=='sentence'&&!n.closest('p')?.contains(document.activeElement)) n.scrollIntoView({block:'nearest',behavior:'instant'})}}}
function updateVisual(){
 const t=audio.currentTime,d=audio.duration;
 const timer=$('audioTime');if(timer)timer.textContent=clock(t)+' / '+clock(d);
 const seek=$('seekAudio');if(seek&&document.activeElement!==seek)seek.value=Number.isFinite(d)&&d>0?Math.round(1000*t/d):0;
 if(tab!=='sentence'){
  let i=S.findIndex(s=>t>=s.range[0]&&t<s.range[1]);
  setHighlight(i);
 }else{setHighlight(-1);let focus=document.querySelector('.focus');if(focus)focus.classList.toggle('is-playing',!audio.paused&&!!range&&t>=range.start&&t<range.end)}
}
function pauseAudio(){audio.pause();cancelAnimationFrame(frame);updateVisual()}
function stopAudio(){token++;range=null;audio.pause();cancelAnimationFrame(frame);try{audio.currentTime=0}catch(e){}setHighlight(-1);const focus=document.querySelector('.focus.is-playing');if(focus)focus.classList.remove('is-playing');updateVisual()}
function tick(){
 if(range&&audio.currentTime>=range.end-0.018){audio.pause();cancelAnimationFrame(frame);let end=range.end;range=null;audio.currentTime=end;updateVisual();return}
 updateVisual();if(!audio.paused)frame=requestAnimationFrame(tick)
}
async function playSegment(a,b){
 if(!Number.isFinite(a)||!Number.isFinite(b)||a<0||b<=a)return;
 stopAudio();let own=token;range={start:a,end:b};
 if(audio.readyState===0){await new Promise(resolve=>{if(audio.readyState>0)return resolve();let done=()=>{audio.removeEventListener('loadedmetadata',done);audio.removeEventListener('error',done);resolve()};audio.addEventListener('loadedmetadata',done);audio.addEventListener('error',done);audio.load()})}
 if(own!==token||audio.error)return;
 audio.currentTime=a;try{await audio.play();if(own!==token){return}cancelAnimationFrame(frame);frame=requestAnimationFrame(tick)}catch(e){if(own===token){range=null;updateVisual()}}
}
async function playFull(){
 if(range!==null){token++;range=null;audio.pause();audio.currentTime=0}
 const own=++token;
 try{await audio.play();if(own!==token)return;cancelAnimationFrame(frame);frame=requestAnimationFrame(tick)}catch(e){}
}
audio.addEventListener('timeupdate',()=>{if(range&&audio.currentTime>=range.end-0.018){pauseAudio();const end=range.end;range=null;audio.currentTime=end}updateVisual()});
audio.addEventListener('seeked',updateVisual);audio.addEventListener('loadedmetadata',updateVisual);
audio.addEventListener('ended',()=>{range=null;cancelAnimationFrame(frame);updateVisual()});
function reset(){vi=false;shown=false;feed='';selected=[];partIdx=0;typed='';stopAudio()}
function matches(text){let a=[];for(let i=0;i<V.length;i++){let q=V[i].en;let start=0;while((start=text.toLowerCase().indexOf(q.toLowerCase(),start))!==-1){a.push({start,end:start+q.length,i});start+=q.length}}a.sort((x,y)=>x.start-y.start||y.end-x.end);let out=[],end=0;for(let x of a)if(x.start>=end){out.push(x);end=x.end}return out}
function marked(text,mixed){if(!terms&&!mixed)return esc(text);let a=matches(text),at=0,out='';for(let x of a){out+=esc(text.slice(at,x.start));out+=`<span tabindex="0" role="button" class="${mixed?'mix':'term'}" data-v="${x.i}">${esc(mixed?V[x.i].vi:text.slice(x.start,x.end))}</span>`;at=x.end}return out+esc(text.slice(at))}
function renderArticle(){let res='',last=0;S.forEach(s=>{if(s.p!==last){if(last)res+='</p>';res+='<p>';last=s.p}res+=`<span class="sentence" data-s="${s.id}">${marked(s.en,tab==='mix')}</span> `;if(vi)res+=`<span class="translation" style="display:block">${esc(s.vi)}</span>`});$('article').innerHTML=res+'</p>';$('translationToggle').textContent='VN · '+(vi?'SHOW':'HIDE');$('translationToggle').setAttribute('aria-expanded',String(vi));$('highlightToggle').textContent='VOCAB · '+(terms?'ON':'OFF');highlighted=-1;updateVisual()}
function showTab(next){if(tab===next)return;tab=next;reset();closeV();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('reading').classList.toggle('hide',tab==='sentence');$('practice').classList.toggle('hide',tab!=='sentence');if(tab==='sentence')renderSentence();else renderArticle()}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(a.length>1&&a.every((x,i)=>x===i))a.reverse();return a}
function go(n){if(n<0||n>=S.length)return;idx=n;reset();bank=shuffle(S[idx].chunks.map((_,i)=>i));renderSentence()}
function switchMode(m){if(m===mode)return;mode=m;reset();bank=shuffle(S[idx].chunks.map((_,i)=>i));document.querySelectorAll('.modebtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));renderSentence()}
function listenControls(rangeName){return `<div class="controls"><button class="btn small pri" id="listenClip">▶ ${rangeName}</button><button class="btn small" id="stopClip">■ Stop</button></div>`}
function renderSentence(){const s=S[idx];$('sentenceTitle').textContent='Sentence '+(idx+1)+' / '+S.length;$('counter').textContent=(idx+1)+' / '+S.length;$('sentenceSelect').value=idx;$('prev').disabled=idx===0;$('next').disabled=idx===S.length-1;let html='';
 if(mode==='read')html=`<div class="focus">${marked(s.en,false)}</div>${listenControls('Listen to sentence')}<div class="controls"><button class="btn small" id="vn">VN · ${vi?'SHOW':'HIDE'}</button></div>${vi?`<div class="hintbox">${esc(s.vi)}</div>`:''}`;
 else if(mode==='build')html=`${listenControls('Listen to sentence')}<div class="mini">Build the original sentence in the correct order.</div><div class="build-area" id="chosen">${selected.length?selected.map((x,n)=>`<button class="chunk" data-sel="${n}">${esc(s.chunks[x])}</button>`).join(''):'<span class="muted">Tap the chunks to build the sentence.</span>'}</div><div class="bank">${bank.filter(x=>!selected.includes(x)).map(x=>`<button class="chunk" data-chunk="${x}">${esc(s.chunks[x])}</button>`).join('')}</div><div class="controls"><button class="btn pri" id="check">Check</button><button class="btn" id="hint">Hint</button><button class="btn" id="clear">Clear</button><button class="btn" id="answer">${shown?'Hide answer':'Show answer'}</button><button class="btn" id="vn">VN · ${vi?'SHOW':'HIDE'}</button></div>${vi?`<div class="hintbox">${esc(s.vi)}</div>`:''}${shown?`<div class="hintbox">${esc(s.en)}</div>`:''}<div class="feedback">${esc(feed)}</div>`;
 else{const p=s.parts[partIdx];html=`<div class="mini">Sentence ${idx+1}/${S.length} · Part ${partIdx+1}/${s.parts.length}</div>${listenControls('Listen to part')}<div class="controls"><button class="btn small" id="partBack" ${partIdx===0?'disabled':''}>← Part</button><button class="btn small" id="partNext" ${partIdx===s.parts.length-1?'disabled':''}>Next part →</button></div><textarea class="field" id="inputText" spellcheck="false" placeholder="Type exactly what you hear...">${esc(typed)}</textarea><div class="controls"><button class="btn pri" id="check">Check</button><button class="btn" id="hint">Hint</button><button class="btn" id="clear">Clear</button><button class="btn" id="answer">${shown?'Hide answer':'Show answer'}</button><button class="btn" id="vn">VN · ${vi?'SHOW':'HIDE'}</button></div>${vi?`<div class="hintbox">${esc(s.vi)}</div>`:''}${shown?`<div class="hintbox">${esc(p)}</div>`:''}<div class="feedback">${esc(feed)}</div>`}
 $('exercise').innerHTML=html;updateVisual()}
function check(){let s=S[idx];if(mode==='build'){feed=selected.length===s.chunks.length&&selected.every((n,i)=>n===i)?'✓ Correct — original sentence restored.':'Not yet in the original order. Try again.'}else{typed=$('inputText').value;feed=normalize(typed)===normalize(s.parts[partIdx])?'✓ Correct transcription.':'Check the words and word forms. Try again.'}renderSentence()}
function hint(){if(mode==='build'){const n=selected.length;const expected=n;if(expected<S[idx].chunks.length){if(!selected.includes(expected)){selected.push(expected);feed='One chunk has been added.'}else feed='The next chunk is already selected.'}else feed='All chunks are selected.'}else{typed=$('inputText').value;feed='Hint: '+S[idx].parts[partIdx].split(/\s+/).slice(0,3).join(' ')+' …'}renderSentence()}
function openV(i){vocabIdx=i;let x=V[i];$('vocabEn').textContent=x.en;$('vocabIpa').textContent=x.ipa;$('vocabVi').textContent=x.vi;$('vocabExample').textContent=x.example;$('vocabStatus').textContent=studied[i]||'';$('overlay').classList.remove('hide');$('popover').classList.remove('hide');$('vocabClose').focus()}
function closeV(){$('overlay').classList.add('hide');$('popover').classList.add('hide')}
document.addEventListener('click',e=>{
 let t=e.target.closest('[data-tab],[data-mode],[data-v],[data-chunk],[data-sel]');
 if(t?.dataset.tab){showTab(t.dataset.tab);return}if(t?.dataset.mode){switchMode(t.dataset.mode);return}
 if(t?.dataset.v!==undefined){openV(+t.dataset.v);return}
 if(t?.dataset.chunk!==undefined){selected.push(+t.dataset.chunk);feed='';renderSentence();return}
 if(t?.dataset.sel!==undefined){selected.splice(+t.dataset.sel,1);feed='';renderSentence();return}
 const id=e.target.closest('button')?.id;
 if(id==='listenClip'){const s=S[idx],r=mode==='type'?s.partRanges[partIdx]:s.range;playSegment(...r);return}
 if(id==='stopClip'){stopAudio();return}
 if(id==='vn'){vi=!vi;renderSentence()}
 if(id==='check')check();if(id==='hint')hint();
 if(id==='clear'){selected=[];typed='';feed='';shown=false;bank=shuffle(S[idx].chunks.map((_,i)=>i));renderSentence()}
 if(id==='answer'){if(mode==='type')typed=$('inputText').value;shown=!shown;renderSentence()}
 if(id==='partBack'||id==='partNext'){partIdx+=id==='partBack'?-1:1;vi=false;shown=false;typed='';feed='';stopAudio();renderSentence()}
});
document.addEventListener('input',e=>{if(e.target.id==='inputText')typed=e.target.value});
$('playAll').onclick=()=>playFull();$('pauseAll').onclick=()=>pauseAudio();$('stopAll').onclick=()=>stopAudio();
function changeSpeed(rate){audio.playbackRate=Number(rate)||1;if($('speed'))$('speed').value=(Number(rate)===0.85?'.85':rate)+'×';if($('sentenceSpeed'))$('sentenceSpeed').value=String(rate)}
$('speed').onchange=e=>changeSpeed(parseFloat(e.target.value));$('sentenceSpeed').onchange=e=>changeSpeed(e.target.value);
$('seekAudio').oninput=e=>{if(Number.isFinite(audio.duration)){range=null;audio.currentTime=audio.duration*(+e.target.value)/1000;updateVisual()}};
$('translationToggle').onclick=()=>{vi=!vi;renderArticle()};$('highlightToggle').onclick=()=>{terms=!terms;renderArticle()};
$('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx+1);$('sentenceSelect').onchange=e=>go(+e.target.value);
$('overlay').onclick=closeV;$('vocabClose').onclick=closeV;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeV();if((e.key==='Enter'||e.key===' ')&&e.target.dataset.v!==undefined){e.preventDefault();openV(+e.target.dataset.v)}});
$('known').onclick=()=>{studied[vocabIdx]='I know this';$('vocabStatus').textContent='I know this'};
$('study').onclick=()=>{studied[vocabIdx]='Study';$('vocabStatus').textContent='Added to study list'};
S.forEach((s,i)=>$('sentenceSelect').add(new Option('Sentence '+(i+1)+' · P'+s.p,i)));
bank=shuffle(S[0].chunks.map((_,i)=>i));changeSpeed(1);renderArticle();
</script></body></html>
